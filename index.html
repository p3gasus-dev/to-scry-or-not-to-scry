<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To Scry or Not to Scry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, two ranked ledgers (orbs, then maps), search strings, notes last. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#14181d; --muted:#5b6672; --line:#d9dde2;
  --accent:#1f6f8b; --up:#1a7f4b; --down:#b3342f; --warn:#8a6100;
  --display:"Spectral",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --panel:#161e24; --fg:#e6ebef; --muted:#93a0ab; --line:#27323a;
  --accent:#5cc2e0; --up:#4cc38a; --down:#ef7b73; --warn:#e0b252; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --panel:#161e24; --fg:#e6ebef; --muted:#93a0ab; --line:#27323a;
  --accent:#5cc2e0; --up:#4cc38a; --down:#ef7b73; --warn:#e0b252; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-size:clamp(1.9rem,5vw,2.6rem);margin:0;text-wrap:balance;line-height:1.08}
h2{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem;max-width:62ch}
.status.warn{color:var(--warn)}
.status{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin:10px 0 0}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:1340px){
  main{max-width:1440px}
  .cols{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
  .cols table.wide{min-width:0}
  .cols th,.cols td{padding:10px 6px}
  .cols th:first-child,.cols td:first-child{padding-left:10px}
  .cols th:last-child,.cols td:last-child{padding-right:10px}
  .cols th{letter-spacing:.05em}
  .cols td.num{font-size:.85rem}
}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
table.wide{min-width:700px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.cardicon{width:.75em;height:1em;vertical-align:-.15em;margin-right:5px}
.orbicon{width:28px;height:28px;vertical-align:middle;margin-right:8px;object-fit:contain}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
th:nth-child(1),td:nth-child(1){text-align:left;width:2.5rem;color:var(--muted);font-family:var(--mono)}
th:nth-child(2),td:nth-child(2){text-align:left}
td.name{font-family:var(--display);font-weight:700;font-size:1.05rem}
td.name small{display:block;font:400 .72rem var(--body);color:var(--muted);margin-top:2px;letter-spacing:.01em}
td.num{font-family:var(--mono);font-size:.9rem}
td.key{color:var(--accent);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.unk{color:var(--warn);cursor:help}
.flag{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--warn);color:var(--warn);border-radius:3px;font:500 .65rem var(--mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.searches{display:flex;flex-direction:column;gap:14px}
.search{display:flex;flex-direction:column;gap:6px;min-width:0}
.search label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.searchrow{display:flex;gap:8px;min-width:0}
.searchrow input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:.85rem;padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px}
.searchrow button{font:inherit;font-size:.9rem;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:4px;cursor:pointer;min-width:4.5rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:.92rem}
.note{color:var(--muted);font-size:.82rem;max-width:70ch;margin:0}
.note a,.sub a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>To Scry or Not to Scry</h1>
    <p class="status" id="status" role="status">Loading…</p>
    <p class="status warn" id="notice" hidden></p>
    <p class="note" id="sources">Data from <a href="https://poe.ninja" rel="noopener">poe.ninja</a>, <a href="https://poedb.tw/us/Atlas_of_Worlds" rel="noopener">PoEDB</a> and <a href="https://mapsofexile.com" rel="noopener">Maps of Exile</a>.</p>
  </header>

  <section id="searchSection" hidden>
    <div class="search">
      <label for="reOrbs">Maps to farm scrying orbs</label>
      <div class="searchrow"><input id="reOrbs" readonly spellcheck="false"><button type="button" data-copy="reOrbs">Copy</button></div>
    </div>
  </section>

  <div class="cols">
  <section id="orbSection" hidden>
    <h2>Scrying Orbs</h2>
    <div class="table-wrap">
      <table class="wide">
        <thead><tr><th>#</th><th>Orb</th><th>Price</th><th><svg class="cardicon" viewBox="0 0 16 22" aria-hidden="true"><rect x="1" y="1" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor" opacity=".35"/><path d="M4 16h8M4 18.5h5" stroke="currentColor" stroke-width="1.2"/></svg>Avg card</th><th>Map score</th><th>7d</th></tr></thead>
        <tbody id="orbRows"></tbody>
      </table>
    </div>
  </section>

  <section id="mapSection" hidden>
    <h2>Best maps to scry onto</h2>
    <div class="table-wrap">
      <table class="wide">
        <thead><tr><th>#</th><th>Map</th><th>Score</th><th>Layout</th><th>Density</th><th>Boss</th><th><svg class="cardicon" viewBox="0 0 16 22" aria-hidden="true"><rect x="1" y="1" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor" opacity=".35"/><path d="M4 16h8M4 18.5h5" stroke="currentColor" stroke-width="1.2"/></svg>Avg card</th></tr></thead>
        <tbody id="mapRows"></tbody>
      </table>
    </div>
  </section>
  </div>

  <section class="msg" id="error" hidden></section>

</main>

<script>
(function(){
  var RELOAD_MS = 5 * 60 * 1000;
  var W = { layout: 3, density: 2, boss: 1, cards: 2 };
  var TAGS = { linear: "Linear", few_obstacles: "Few obstacles", outdoors: "Outdoors", boss_rushable: "Rushable boss" };
  var $ = function(id){ return document.getElementById(id); };

  var ratings = {};
  var mapCards = {};
  var orbIcon = "";
  var divRate = 0;      // chaos per divine

  function fmt(n, d){ return Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function rowCell(tr, text, cls){ var td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; }

  // One price figure: divines once it is worth a divine or more, chaos below that.
  function fmtPrice(chaos){
    if (divRate > 0 && chaos >= divRate){
      var d = chaos / divRate;
      return fmt(d, d >= 10 ? 1 : 2) + " d";
    }
    if (chaos < 0.1) return "< 0.1 c";
    return fmt(chaos, chaos >= 100 ? 0 : 1) + " c";
  }

  function qualityScore(m){
    return (W.layout*m.layout + W.density*m.density + W.boss*m.boss) / (10*(W.layout+W.density+W.boss)) * 100;
  }

  // Average price (chaos) of the four cards listed for a map, or null when the map has no card list.
  function avgCard(name){
    var cs = mapCards[name];
    if (!cs || !cs.length) return null;
    return cs.reduce(function(sum, c){ return sum + (c.price || 0); }, 0) / cs.length;
  }

  // Average card price as points from 0 (worthless) toward 10 (very valuable). 100 c is the midpoint,
  // so a handful of chaos hardly moves the score while a map with a very dear card does.
  var CARD_MIDPOINT = 100;
  function cardPoints(avg){
    return 10 * avg / (avg + CARD_MIDPOINT);
  }

  function mapScore(m){
    var avg = avgCard(m.name);
    var pts = avg == null ? 5 : cardPoints(avg);
    return (W.layout*m.layout + W.density*m.density + W.boss*m.boss + W.cards*(10 - pts)) /
           (10*(W.layout+W.density+W.boss+W.cards)) * 100;
  }

  // Search strings: quote names with spaces, join with |, stay under the game's 250 character limit.
  function searchString(names){
    var parts = [];
    var len = 0;
    for (var i = 0; i < names.length; i++){
      var p = /^[A-Za-z0-9]+$/.test(names[i]) ? names[i] : '"' + names[i] + '"';
      if (len + p.length + (parts.length ? 1 : 0) > 250) break;
      len += p.length + (parts.length ? 1 : 0);
      parts.push(p);
    }
    return parts.join("|");
  }

  function cardCell(tr, name){
    var avg = avgCard(name);
    var td = rowCell(tr, avg == null ? "–" : fmtPrice(avg), "num");
    var cs = mapCards[name];
    if (cs) td.title = cs.map(function(c){ return c.name + " " + fmtPrice(c.price || 0); }).join("\n");
  }

  function renderOrbs(lines){
    var top = lines
      .filter(function(l){ return l && l.chaosValue > 0; })
      .sort(function(a,b){ return b.chaosValue - a.chaosValue; })
      .slice(0,10);
    var tbody = $("orbRows");
    tbody.textContent = "";
    top.forEach(function(l,i){
      var tr = document.createElement("tr");
      rowCell(tr, String(i+1));
      var name = rowCell(tr, l.name, "name");
      if (orbIcon){ var im = document.createElement("img"); im.className = "orbicon"; im.alt = ""; im.src = orbIcon; im.loading = "lazy"; im.onerror = function(){ im.remove(); }; name.insertBefore(im, name.firstChild); }
      if ((l.count||0) < 3 || (l.listingCount||0) < 5){ var f = document.createElement("span"); f.className="flag"; f.textContent="Thin data"; name.appendChild(f); }
      rowCell(tr, fmtPrice(l.chaosValue), "num key");
      cardCell(tr, l.name);
      var r = ratings[l.name];
      rowCell(tr, r ? fmt(qualityScore(r),0) : "–", "num");
      var ch = typeof l.change === "number" ? l.change : null;
      rowCell(tr, ch == null ? "–" : (ch > 0 ? "+" : "") + fmt(ch,0) + "%", "num " + (ch > 0 ? "up" : ch < 0 ? "down" : ""));
      tbody.appendChild(tr);
    });
    $("orbSection").hidden = top.length === 0;
    $("reOrbs").value = searchString(top.map(function(l){ return l.name; }));
  }

  function renderMaps(maps){
    var ranked = (maps || [])
      .filter(function(m){ return m && m.layout != null && m.density != null && m.boss != null; })
      .map(function(m){ return Object.assign({}, m, { score: mapScore(m) }); })
      .sort(function(a,b){ return b.score - a.score || b.density - a.density || b.boss - a.boss || a.name.localeCompare(b.name); })
      .slice(0,10);
    var tbody = $("mapRows");
    tbody.textContent = "";
    ranked.forEach(function(m,i){
      var tr = document.createElement("tr");
      rowCell(tr, String(i+1));
      var name = rowCell(tr, m.name, "name");
      var tags = (m.tags || []).filter(function(t){ return TAGS[t]; }).map(function(t){ return TAGS[t]; });
      if (tags.length){ var s = document.createElement("small"); s.textContent = tags.join(" · "); name.appendChild(s); }
      rowCell(tr, fmt(m.score,0), "num key");
      rowCell(tr, String(m.layout), "num");
      rowCell(tr, (m.densityEstimated ? "~" : "") + m.density, "num");
      rowCell(tr, String(m.boss), "num");
      cardCell(tr, m.name);
      tbody.appendChild(tr);
    });
    $("mapSection").hidden = ranked.length === 0;
  }

  function setupCopy(){
    document.querySelectorAll("button[data-copy]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var input = $(btn.getAttribute("data-copy"));
        var done = function(ok){
          btn.textContent = ok ? "Copied" : "Press Ctrl+C";
          setTimeout(function(){ btn.textContent = "Copy"; }, 1800);
        };
        try {
          await navigator.clipboard.writeText(input.value);
          done(true);
        } catch (e) {
          input.focus(); input.select();
          done(false);
        }
      });
    });
  }

  async function load(){
    try {
      var res = await fetch("data.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("data.json returned " + res.status);
      var json = await res.json();
      json.lines = json.lines || [];
      $("error").hidden = true;

      // Chaos per divine, from the dearest orb (the most precise ratio).
      divRate = 0;
      var best = null;
      json.lines.forEach(function(l){ if (l.divineValue >= 1 && (!best || l.chaosValue > best.chaosValue)) best = l; });
      if (best) divRate = best.chaosValue / best.divineValue;

      ratings = {};
      (json.maps || []).forEach(function(m){ ratings[m.name] = m; });
      mapCards = json.mapCards || {};

      $("reOrbs").value = "";
      orbIcon = ((json.lines.filter(function(l){ return l.icon; })[0]) || {}).icon || "";
      renderOrbs(json.lines);
      renderMaps(json.maps);
      $("searchSection").hidden = !$("reOrbs").value;
      var when = new Date(json.fetchedAt);

      // Say so when the data is thin, early in a league or behind.
      var notes = [];
      if (!json.lines.length) notes.push("No scrying orbs are priced in " + json.league + " yet. Maps are ranked on ratings and card prices alone and this page fills in once poe.ninja has prices.");
      var r = json.ratings || {};
      if (r.league && json.league && r.league !== json.league) notes.push("Map ratings still come from " + r.league + " and will update when Maps of Exile catches up.");
      $("status").classList.toggle("warn", !isNaN(when) && Date.now() - when > 3 * 3600 * 1000);
      if (json.cardPrices && json.cardPrices !== json.league) notes.push("Card prices are from " + json.cardPrices + " until " + json.league + " has enough data.");
      var cl = json.cardLists || {};
      if (cl.source === "snapshot") notes.push("Map card lists are a saved snapshot, not live from PoEDB.");
      else if (cl.updated && (Date.now() - new Date(cl.updated)) > 14 * 86400 * 1000) notes.push("Map card lists were last refreshed " + cl.updated + ".");
      $("notice").textContent = notes.join(" ");
      $("notice").hidden = !notes.length;
      $("status").textContent = json.league + (isNaN(when) ? "" : " · prices updated " + when.toLocaleString());
    } catch (e) {
      $("error").hidden = false;
      $("error").textContent = "No data yet. In the repository, open the Actions tab, run “Update scrying orb prices” once, then reload. (" + e.message + ")";
      $("status").textContent = "Waiting for first update";
    }
  }

  setupCopy();
  load();
  setInterval(load, RELOAD_MS);
})();
</script>
</body>
</html>
